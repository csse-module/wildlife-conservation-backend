spring.application.name=wildlife-conservationbackend
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wildlife_conservation}
spring.data.mongodb.auto-index-creation=true
spring.jackson.deserialization.fail-on-unknown-properties=true
wildlife.jwt.issuer=wildlife-conservationbackend
wildlife.jwt.secret=${JWT_SECRET:}
wildlife.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
wildlife.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
wildlife.seed.enabled=${DEV_SEED_ENABLED:false}
wildlife.seed.password=${DEV_SEED_PASSWORD:}
logging.pattern.level=%5p [requestId=%X{requestId}]
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
wildlife.media.directory=${MEDIA_STORAGE_DIR:uploads}
wildlife.reports.font-path=${REPORT_FONT_PATH:}
